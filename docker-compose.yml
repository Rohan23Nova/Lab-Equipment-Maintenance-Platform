version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# LabLedger — Local Development Infrastructure
#
# Starts: PostgreSQL only.
# The Spring Boot backend and React frontend run with their respective dev
# servers for hot-reload during development.
#
# Usage:
#   docker compose up -d
#   ./mvnw spring-boot:run   (backend, separate terminal)
#   npm run dev --prefix frontend  (frontend, separate terminal)
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: labledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-labledger}
      POSTGRES_USER: ${DB_USER:-labledger_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-labledger_user} -d ${DB_NAME:-labledger}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: labledger-postgres-data
