# ─────────────────────────────────────────────────────────────────────────────
# LabLedger — Full Production Stack
#
# Starts: PostgreSQL + Spring Boot backend + React/nginx frontend.
#
# Prerequisites:
#   - Copy .env.example to .env and fill in all required values.
#   - Build images: docker compose -f docker-compose.prod.yml build
#   - Start:        docker compose -f docker-compose.prod.yml up -d
#
# Service startup order:
#   postgres (healthy) → backend (healthy) → frontend
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: labledger-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Do NOT expose port 5432 publicly in production.
    # Backend connects via the internal Docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - labledger-backend

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: labledger-backend:latest
    container_name: labledger-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
      SESSION_COOKIE_SECURE: "true"
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - labledger-backend
      - labledger-frontend
    # Never expose the backend port directly in production;
    # all traffic flows through the nginx frontend proxy.

  # ── React Frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    image: labledger-frontend:latest
    container_name: labledger-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - labledger-frontend

networks:
  # Backend network: postgres ↔ backend only
  labledger-backend:
    name: labledger-backend-network
    driver: bridge
  # Frontend network: backend ↔ nginx only
  labledger-frontend:
    name: labledger-frontend-network
    driver: bridge

volumes:
  postgres-data:
    name: labledger-postgres-data-prod
